name: Deploy PaintGuard

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────
      # 1. 코드 체크아웃
      # ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # 2. Node.js 설정
      # ─────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ─────────────────────────────────────────
      # 3. pnpm 설정
      # ─────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      # ─────────────────────────────────────────
      # 4. 의존성 설치
      # ─────────────────────────────────────────
      - name: Install dependencies
        working-directory: dashboard/dashboard_re
        run: pnpm install --frozen-lockfile

      # ─────────────────────────────────────────
      # 5. 빌드
      # ─────────────────────────────────────────
      - name: Build
        working-directory: dashboard/dashboard_re
        run: pnpm build

      # ─────────────────────────────────────────
      # 6. SSH 키 설정
      # ─────────────────────────────────────────
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 400 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # ─────────────────────────────────────────
      # 7. 프론트엔드 배포 (정적 파일)
      # ─────────────────────────────────────────
      - name: Deploy frontend
        working-directory: dashboard/dashboard_re
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/public/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.FRONTEND_PATH }}/

      # ─────────────────────────────────────────
      # 8. 백엔드 배포 (서버 코드)
      # ─────────────────────────────────────────
      - name: Deploy backend
        working-directory: dashboard/dashboard_re
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/index.js \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.BACKEND_PATH }}/

      # ─────────────────────────────────────────
      # 9. 환경변수 파일 + PM2 재시작
      # ─────────────────────────────────────────
      - name: Restart PM2
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "pm2 describe paintguard-api > /dev/null 2>&1 \
              && pm2 restart paintguard-api \
              || pm2 start ${{ secrets.BACKEND_PATH }}/index.js \
                  --name paintguard-api \
                  --env-file /etc/paintguard/.env \
              && pm2 save"
