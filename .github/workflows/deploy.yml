name: Deploy PaintGuard

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────
      # 1. 코드 체크아웃
      # ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # 2. Node.js 설정
      # ─────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ─────────────────────────────────────────
      # 3. pnpm 설정
      # ─────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      # ─────────────────────────────────────────
      # 4. 의존성 설치
      # ─────────────────────────────────────────
      - name: Install dependencies
        working-directory: dashboard/dashboard_re
        run: pnpm install --frozen-lockfile

      # ─────────────────────────────────────────
      # 5. 빌드
      # ─────────────────────────────────────────
      - name: Build
        working-directory: dashboard/dashboard_re
        run: pnpm build

      # ─────────────────────────────────────────
      # 6. AWS CLI 설정
      # ─────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # ─────────────────────────────────────────
      # 7. 현재 러너 IP를 보안 그룹에 추가
      # ─────────────────────────────────────────
      - name: Add runner IP to security group
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "Runner IP: $RUNNER_IP"
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          aws ec2 authorize-security-group-ingress \
            --group-id sg-0fbc7c85c795683fc \
            --protocol tcp \
            --port 22 \
            --cidr ${RUNNER_IP}/32

      # ─────────────────────────────────────────
      # 8. SSH 키 설정
      # ─────────────────────────────────────────
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 400 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # ─────────────────────────────────────────
      # 9. 프론트엔드 배포 (정적 파일)
      # ─────────────────────────────────────────
      - name: Deploy frontend
        working-directory: dashboard/dashboard_re
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/public/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.FRONTEND_PATH }}/

      # ─────────────────────────────────────────
      # 10. 백엔드 배포 (서버 코드)
      # ─────────────────────────────────────────
      - name: Deploy backend
        working-directory: dashboard/dashboard_re
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/index.js \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.BACKEND_PATH }}/

      # ─────────────────────────────────────────
      # 11. PM2 재시작
      # ─────────────────────────────────────────
      - name: Restart PM2
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "pm2 describe paintguard-api > /dev/null 2>&1 \
              && pm2 restart paintguard-api \
              || pm2 start ${{ secrets.BACKEND_PATH }}/index.js \
                  --name paintguard-api \
                  --env-file /etc/paintguard/.env \
              && pm2 save"

      # ─────────────────────────────────────────
      # 12. 러너 IP를 보안 그룹에서 제거 (항상 실행)
      # ─────────────────────────────────────────
      - name: Remove runner IP from security group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id sg-0fbc7c85c795683fc \
            --protocol tcp \
            --port 22 \
            --cidr ${{ env.RUNNER_IP }}/32
